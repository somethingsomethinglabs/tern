name: Linux release candidate
on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing signed release sequence
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 desktop-file-utils xdotool xvfb
      # Ubuntu AppArmor otherwise blocks Electron user namespaces in this ephemeral runner.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build:desktop
      - run: npm run test:core && npm run test:unit
      - run: xvfb-run -a npm test --workspace=@tern/desktop -- e2e/browser.spec.ts e2e/extension-windows.spec.ts e2e/file-saving.spec.ts e2e/storage-access.spec.ts
      - run: node desktop/scripts/package.mjs
      - run: xvfb-run -a npm run test:package:desktop
      - name: Sign release candidate
        env:
          TERN_RELEASE_SIGNING_KEY_PEM: ${{ secrets.TERN_RELEASE_SIGNING_KEY_PEM }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
        run: |
          test -n "$TERN_RELEASE_SIGNING_KEY_PEM"
          umask 077
          key_path="$RUNNER_TEMP/tern-release-key.pem"
          printf '%s' "$TERN_RELEASE_SIGNING_KEY_PEM" > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          version="$(node -p "require('./desktop/package.json').version")"
          TERN_RELEASE_SIGNING_KEY="$key_path" node desktop/scripts/sign-release.mjs desktop/release/Tern-linux-x64 "https://github.com/somethingsomethinglabs/tern/releases/download/linux-v${version}/tern-linux-x64.tar.gz" "$RELEASE_SEQUENCE"
          cp desktop/release/Tern-linux-x64.tar.gz desktop/release/tern-linux-x64.tar.gz
          cp desktop/release/Tern-linux-x64.manifest.json desktop/release/tern-linux-x64.manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-candidate
          path: |
            desktop/release/tern-linux-x64.tar.gz
            desktop/release/tern-linux-x64.manifest.json
          retention-days: 14
